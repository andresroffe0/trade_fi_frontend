<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeFi — Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    body {
      background: linear-gradient(135deg, #0d1030 0%, #191C46 50%, #252963 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: -120px; left: -120px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(208,92,70,0.18) 0%, transparent 70%);
      border-radius: 50%;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -80px; right: -80px;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
      border-radius: 50%;
    }
    .login-wrapper {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }
    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 48px; height: 48px;
      background: var(--accent);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(208,92,70,0.4);
    }
    .login-logo-text {
      font-size: 2rem;
      font-weight: 800;
      color: white;
      letter-spacing: -0.5px;
    }
    .login-card {
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      padding: 40px;
    }
    .login-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .login-card .login-subtitle {
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-bottom: 28px;
    }
    .login-footer-text {
      text-align: center;
      margin-top: 20px;
      color: rgba(255,255,255,0.55);
      font-size: 0.8rem;
    }
    .login-footer-text a {
      color: rgba(255,255,255,0.75);
      text-decoration: underline;
    }
    .demo-hint {
      background: rgba(25,28,70,0.06);
      border: 1px solid rgba(25,28,70,0.12);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .demo-hint svg { flex-shrink: 0; color: var(--info); }
    .demo-hint strong { color: var(--text-primary); }
    .forgot-link {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }
    .forgot-link:hover { color: var(--accent-dark); text-decoration: underline; }
    .form-check-label a { color: var(--accent); font-weight: 500; }
    @media (max-width: 480px) {
      .login-card { padding: 28px 24px; }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
      <span class="login-logo-text">TradeFi</span>
    </div>

    <!-- Card -->
    <div class="login-card">
      <h2>Bienvenido de nuevo</h2>
      <p class="login-subtitle">Inicia sesión en tu cuenta para continuar</p>

      <!-- Demo Hint -->
      <div class="demo-hint">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>Demo: <strong>demo@example.com</strong> / <strong>demo123</strong></span>
      </div>

      <!-- Form -->
      <form id="login-form" novalidate>
        <div class="form-group" style="margin-bottom:16px;">
          <label class="form-label" for="login-email">
            Correo electrónico <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input type="email" id="login-email" class="form-control" placeholder="correo@empresa.com" autocomplete="email">
          </div>
          <div class="form-error" data-field="login-email"></div>
        </div>

        <div class="form-group" style="margin-bottom:20px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <label class="form-label" for="login-password" style="margin-bottom:0;">
              Contraseña <span class="required">*</span>
            </label>
            <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="login-password" class="form-control has-icon-right" placeholder="••••••••" autocomplete="current-password">
            <span class="input-icon-right" id="toggle-password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </div>
          <div class="form-error" data-field="login-password"></div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" id="remember-me">
            <span class="form-check-label">Recordarme</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Iniciar Sesión
        </button>

        <div id="login-error" style="margin-top:14px;padding:10px 14px;background:var(--error-light);border:1px solid rgba(239,68,68,0.25);border-radius:8px;font-size:0.82rem;color:#991b1b;display:none;align-items:center;gap:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          <span id="login-error-msg">Credenciales incorrectas. Por favor intenta de nuevo.</span>
        </div>
      </form>
    </div>

    <p class="login-footer-text">
      © 2024 TradeFi. Todos los derechos reservados. <a href="#">Términos y Condiciones</a>
    </p>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/calculator.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    // Toggle password visibility
    document.getElementById('toggle-password').addEventListener('click', function () {
      var pwd = document.getElementById('login-password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    });

    // Login form submit
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var errorBanner = document.getElementById('login-error');
      errorBanner.style.display = 'none';

      var required = [
        { id: 'login-email',    message: 'El correo es requerido', type: 'email' },
        { id: 'login-password', message: 'La contraseña es requerida' }
      ];

      if (!Forms.validateRequired(required)) return;

      var email    = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;

      Forms.showLoadingState('login-btn', 'Verificando...');

      setTimeout(function () {
        if (email === 'demo@example.com' && password === 'demo123') {
          var user = MockData.currentUser;
          localStorage.setItem('tradefi_user', JSON.stringify(user));
          window.location.href = 'dashboard.html';
        } else {
          Forms.hideLoadingState('login-btn', '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Iniciar Sesión');
          errorBanner.style.display = 'flex';
        }
      }, 1000);
    });
  </script>
</body>
</html>
